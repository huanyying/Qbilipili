name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools & platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1

      - name: Prepare tools dir
        run: |
          mkdir -p "$HOME/ci-tools"
          cp "$ANDROID_HOME/platforms/android-34/android.jar" "$HOME/ci-tools/android.jar"
          curl -fsSL -o "$HOME/ci-tools/r8.jar" \
            "https://maven.google.com/com/android/tools/r8/8.3.37/r8-8.3.37.jar"

      - name: Add aapt to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Restore signing keystore from secret
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > debug.keystore
            chmod 600 debug.keystore
          fi

      - name: Build APK
        run: |
          export JDK="$JAVA_HOME"
          export TOOLS="$HOME/ci-tools"
          bash build.sh

      - name: Rename APK with version
        run: |
          cp out/signed.apk "QbiliPlili-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QbiliPlili-*.apk
          generate_release_notes: true
          body: |
            **QbiliPlili** LSPosed 模块（自动构建）。
            仅供学习交流使用，请勿商用。
            安装前请确认已具备 ROOT + LSPosed + PiliPlus。